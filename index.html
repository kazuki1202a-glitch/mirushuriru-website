<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>株式会社ミルシュリール</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: #f8f9fa;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 60px 50px;
      max-width: 560px;
      width: 100%;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
      text-align: center;
    }
    .logo {
      font-size: 13px;
      letter-spacing: 0.15em;
      color: #888;
      margin-bottom: 16px;
      text-transform: uppercase;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 32px;
    }
    .divider {
      width: 40px;
      height: 2px;
      background: #3b82f6;
      margin: 0 auto 32px;
    }
    .description {
      font-size: 15px;
      line-height: 1.8;
      color: #555;
      margin-bottom: 40px;
    }
    .contact-label {
      font-size: 12px;
      letter-spacing: 0.1em;
      color: #999;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .contact-email {
      font-size: 15px;
      color: #3b82f6;
      text-decoration: none;
    }
    .contact-email:hover { text-decoration: underline; }
    footer {
      margin-top: 48px;
      font-size: 12px;
      color: #bbb;
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="logo">Company</p>
    <h1>株式会社ミルシュリール</h1>
    <div class="divider"></div>
    <p class="description">
      医療現場の業務効率化を支援するAIプロダクトの開発・提供を行っています。<br>
      現在、AI医療クラーク「Karte-Dash」を開発中です。
    </p>
    <p class="contact-label">Contact</p>
    <a class="contact-email" href="mailto:mirushuriru@mirushuriru.co.jp">
      mirushuriru@mirushuriru.co.jp
    </a>
  </div>
  <footer>© 2026 株式会社ミルシュリール</footer>
</body>
</html>
